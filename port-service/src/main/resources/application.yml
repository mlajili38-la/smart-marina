server:
  port: 8081

spring:
  application:
    name: port-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/portdb}
    username: ${DB_USERNAME:port}
    password: ${DB_PASSWORD:port123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
