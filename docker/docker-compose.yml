# Smart Marina - plateforme complète
#
#   Infrastructure seule (pour lancer les services depuis l'IDE) :
#     docker compose -f docker/docker-compose.yml up -d
#
#   Toute l'application conteneurisée (semaine 7) :
#     docker compose -f docker/docker-compose.yml --profile apps up -d --build
#
# Une base PostgreSQL par microservice : aucun service ne lit la base d'un autre.
# En mode "apps", seuls la Gateway (8080) et Keycloak (8180) sont le point d'entrée des clients :
# les microservices ne publient aucun port vers l'hôte et ne sont joignables que dans le réseau Docker.

name: smart-marina

x-postgres-healthcheck: &postgres-healthcheck
  interval: 5s
  timeout: 5s
  retries: 10

x-service-defaults: &service-defaults
  restart: unless-stopped
  profiles: ["apps"]
  networks: [marina-net]

services:
  # ---------------------------------------------------------------- Bases de données
  postgres-port:
    image: postgres:16
    container_name: postgres-port
    environment:
      POSTGRES_DB: portdb
      POSTGRES_USER: port
      POSTGRES_PASSWORD: port123
    ports:
      - "5433:5432"
    volumes:
      - port-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U port -d portdb"]
    networks: [marina-net]

  postgres-pedestal:
    image: postgres:16
    container_name: postgres-pedestal
    environment:
      POSTGRES_DB: pedestaldb
      POSTGRES_USER: pedestal
      POSTGRES_PASSWORD: pedestal123
    ports:
      - "5434:5432"
    volumes:
      - pedestal-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U pedestal -d pedestaldb"]
    networks: [marina-net]

  postgres-consumption:
    image: postgres:16
    container_name: postgres-consumption
    environment:
      POSTGRES_DB: consumptiondb
      POSTGRES_USER: consumption
      POSTGRES_PASSWORD: consumption123
    ports:
      - "5435:5432"
    volumes:
      - consumption-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U consumption -d consumptiondb"]
    networks: [marina-net]

  postgres-notification:
    image: postgres:16
    container_name: postgres-notification
    environment:
      POSTGRES_DB: notificationdb
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification123
    ports:
      - "5436:5432"
    volumes:
      - notification-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U notification -d notificationdb"]
    networks: [marina-net]

  # ---------------------------------------------------------------- Kafka (mode KRaft, sans ZooKeeper)
  kafka:
    image: apache/kafka:4.3.2
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL : conteneurs du réseau Docker (kafka:29092) ; EXTERNAL : services lancés depuis l'IDE (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks: [marina-net]

  # ---------------------------------------------------------------- Keycloak (sécurité, semaine 8)
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Adresse publique : c'est elle qui figure dans la claim "iss" des jetons
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/smart-marina-realm.json:/opt/keycloak/data/import/smart-marina-realm.json:ro
    networks: [marina-net]

  # ---------------------------------------------------------------- Microservices (profil "apps")
  port-service:
    <<: *service-defaults
    build: ../port-service
    image: smart-marina/port-service:latest
    container_name: port-service
    environment:
      DB_URL: jdbc:postgresql://postgres-port:5432/portdb
      SHOW_SQL: "false"
    depends_on:
      postgres-port:
        condition: service_healthy

  pedestal-service:
    <<: *service-defaults
    build: ../pedestal-service
    image: smart-marina/pedestal-service:latest
    container_name: pedestal-service
    environment:
      DB_URL: jdbc:postgresql://postgres-pedestal:5432/pedestaldb
      PORT_SERVICE_URL: http://port-service:8081
      CONSUMPTION_SERVICE_URL: http://consumption-service:8083
      SHOW_SQL: "false"
    depends_on:
      postgres-pedestal:
        condition: service_healthy

  consumption-service:
    <<: *service-defaults
    build: ../consumption-service
    image: smart-marina/consumption-service:latest
    container_name: consumption-service
    environment:
      DB_URL: jdbc:postgresql://postgres-consumption:5432/consumptiondb
      PEDESTAL_SERVICE_URL: http://pedestal-service:8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SHOW_SQL: "false"
    depends_on:
      postgres-consumption:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    <<: *service-defaults
    build: ../notification-service
    image: smart-marina/notification-service:latest
    container_name: notification-service
    environment:
      DB_URL: jdbc:postgresql://postgres-notification:5432/notificationdb
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SHOW_SQL: "false"
    depends_on:
      postgres-notification:
        condition: service_healthy
      kafka:
        condition: service_healthy

  api-gateway:
    <<: *service-defaults
    build: ../api-gateway
    image: smart-marina/api-gateway:latest
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      PORT_SERVICE_URL: http://port-service:8081
      PEDESTAL_SERVICE_URL: http://pedestal-service:8082
      CONSUMPTION_SERVICE_URL: http://consumption-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/smart-marina
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/smart-marina/protocol/openid-connect/certs
      SECURITY_ENABLED: "true"
    depends_on:
      - port-service
      - pedestal-service
      - consumption-service
      - notification-service
      - keycloak

networks:
  marina-net:
    name: marina-net

volumes:
  port-data:
  pedestal-data:
  consumption-data:
  notification-data:
  kafka-data:
